name: Build and Push to GHCR
on:
  push:
    branches:
      - main
  schedule:
    # Rebuild weekly to pull latest yt-dlp (Sundays at 3am UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/blakdav/tubestreamer:latest
            ghcr.io/blakdav/tubestreamer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
