<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTDL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #e8ff47;
      --accent2: #ff4747;
      --text: #f0f0f0;
      --muted: #666666;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      padding: 32px 24px;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2.4rem;
      letter-spacing: -0.04em;
      color: var(--accent);
    }

    header span {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 32px;
      max-width: 1100px;
    }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* --- Download panel --- */
    .download-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
    }

    .download-box label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      padding: 12px 24px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-danger {
      background: transparent;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      font-size: 0.72rem;
      padding: 6px 12px;
    }

    .btn-danger:hover { background: var(--accent2); color: #fff; opacity: 1; }

    /* --- Status bar --- */
    #status {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #status.active { color: var(--accent); }
    #status.error { color: var(--accent2); }
    #status.done { color: #7fff7f; }

    .spinner {
      width: 12px; height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Video list --- */
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    #video-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

    .video-thumb {
      width: 80px;
      height: 45px;
      object-fit: cover;
      border-radius: 2px;
      background: var(--border);
      flex-shrink: 0;
    }

    .video-thumb-placeholder {
      width: 80px;
      height: 45px;
      background: var(--border);
      border-radius: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.6rem;
    }

    .video-info { flex: 1; min-width: 0; }

    .video-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .video-meta {
      display: flex;
      gap: 16px;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .expiry-warning { color: #ffaa44; }
    .expiry-ok { color: var(--muted); }

    .empty-state {
      color: var(--muted);
      font-size: 0.8rem;
      padding: 32px 0;
      text-align: center;
    }

    /* --- Settings panel --- */
    .settings-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: sticky;
      top: 24px;
      align-self: start;
    }

    .settings-panel h2 {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .setting-row {
      margin-bottom: 20px;
    }

    .setting-row label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .setting-row input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .setting-row input[type="number"]:focus { border-color: var(--accent); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .toggle-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: #000;
    }

    .save-btn {
      width: 100%;
      margin-top: 4px;
    }

    .save-indicator {
      text-align: center;
      font-size: 0.68rem;
      color: #7fff7f;
      margin-top: 8px;
      min-height: 16px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      margin-bottom: 8px;
    }

    .stat-row span:first-child { color: var(--muted); }
    .stat-row span:last-child { font-weight: 700; }

    /* --- Queue --- */
    #queue-section { margin-bottom: 32px; }
    #queue-section[hidden] { display: none; }

    .queue-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .queue-head .section-label { margin-bottom: 0; }

    .link-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .link-btn:hover { color: var(--text); }

    #queue-list { display: flex; flex-direction: column; gap: 8px; }

    .job {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .job-bar {
      position: absolute;
      left: 0; bottom: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    .job-icon { width: 14px; flex-shrink: 0; text-align: center; font-size: 0.8rem; }
    .job.downloading .job-icon { color: var(--accent); }
    .job.queued .job-icon,
    .job.cancelled .job-icon { color: var(--muted); }
    .job.done .job-icon { color: #7fff7f; }
    .job.error .job-icon { color: var(--accent2); }

    .job-info { flex: 1; min-width: 0; }
    .job-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .job-msg {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .job.error .job-msg { color: var(--accent2); }

    .job-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .job-actions .btn { font-size: 0.68rem; padding: 5px 10px; }
  </style>
</head>
<body>

<header>
  <h1>YTDL</h1>
  <span>YouTube → Plex pipeline</span>
</header>

<div class="layout">
  <main>
    <div class="download-box">
      <label>YouTube URL — add as many as you like, they download one after another</label>
      <div class="input-row">
        <input type="text" id="url-input" placeholder="https://youtube.com/watch?v=..." />
        <button class="btn" id="dl-btn" onclick="addToQueue()">Add to Queue</button>
      </div>
      <div id="status"></div>
    </div>

    <div id="queue-section" hidden>
      <div class="queue-head">
        <div class="section-label" id="queue-label">Queue</div>
        <button class="link-btn" id="clear-btn" onclick="clearFinished()">Clear finished</button>
      </div>
      <div id="queue-list"></div>
    </div>

    <div class="section-label" id="list-label">Downloaded Videos</div>
    <div id="video-list"><div class="empty-state">No videos yet.</div></div>
  </main>

  <aside>
    <div class="settings-panel">
      <h2>Auto-Delete Settings</h2>

      <div class="toggle-row">
        <span class="toggle-label">Enabled</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-enabled" onchange="saveConfig()" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <label>Delete after (days)</label>
        <input type="number" id="input-days" min="1" max="365" value="30" onchange="saveConfig()" />
      </div>

      <hr class="divider" />

      <h2>Comments</h2>

      <div class="toggle-row">
        <span class="toggle-label">Save comments</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-comments" onchange="saveConfig()" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <label>Max comments per video</label>
        <input type="number" id="input-comments-max" min="10" max="10000" step="50" value="500" onchange="saveConfig()" />
      </div>

      <button class="btn save-btn" onclick="saveConfig()">Save Settings</button>
      <div class="save-indicator" id="save-indicator"></div>

      <hr class="divider" />

      <div class="stat-row">
        <span>Videos stored</span>
        <span id="stat-count">—</span>
      </div>
      <div class="stat-row">
        <span>Total size</span>
        <span id="stat-size">—</span>
      </div>

      <hr class="divider" />

      <button class="btn btn-danger" style="width:100%" onclick="manualCleanup()">Run Cleanup Now</button>

      <hr class="divider" />

      <button class="btn btn-danger" style="width:100%; margin-bottom:10px;" onclick="rescan()">Rescan Folder</button>
      <button class="btn btn-danger" style="width:100%" onclick="cleanupFragments()">Remove Old Fragments</button>
    </div>
  </aside>
</div>

<script>
  // Every change request sends JSON (the server rejects anything else; see app.py)
  const JSON_HEADERS = { 'Content-Type': 'application/json' };

  async function loadConfig() {
    const r = await fetch('/api/config');
    const c = await r.json();
    document.getElementById('input-days').value = c.auto_delete_days;
    document.getElementById('toggle-enabled').checked = c.auto_delete_enabled;
    document.getElementById('toggle-comments').checked = c.comments_enabled;
    document.getElementById('input-comments-max').value = c.comments_max;
  }

  async function saveConfig() {
    const days = parseInt(document.getElementById('input-days').value);
    const enabled = document.getElementById('toggle-enabled').checked;
    await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        auto_delete_days: days,
        auto_delete_enabled: enabled,
        comments_enabled: document.getElementById('toggle-comments').checked,
        comments_max: parseInt(document.getElementById('input-comments-max').value)
      })
    });
    const ind = document.getElementById('save-indicator');
    ind.textContent = 'Saved.';
    setTimeout(() => ind.textContent = '', 2000);
    loadVideos();
  }

  async function loadVideos() {
    const r = await fetch('/api/videos');
    const videos = await r.json();
    const list = document.getElementById('video-list');
    const label = document.getElementById('list-label');

    let totalSize = 0;
    videos.forEach(v => totalSize += v.size_mb);
    document.getElementById('stat-count').textContent = videos.length;
    document.getElementById('stat-size').textContent = totalSize > 1024
      ? (totalSize / 1024).toFixed(1) + ' GB'
      : totalSize.toFixed(0) + ' MB';

    if (videos.length === 0) {
      list.innerHTML = '<div class="empty-state">No videos downloaded yet.</div>';
      return;
    }

    label.textContent = `Downloaded Videos (${videos.length})`;

    list.innerHTML = videos.map(v => {
      const expiryClass = v.expires_in_days < 7 ? 'expiry-warning' : 'expiry-ok';
      const expiryText = v.expires_in_days > 0
        ? `expires in ${v.expires_in_days}d`
        : `<span style="color:var(--accent2)">expired</span>`;
      const thumb = v.thumbnail
        ? `<img class="video-thumb" src="${escHtml(v.thumbnail)}" alt="" onerror="this.style.display='none'" />`
        : `<div class="video-thumb-placeholder">NO THUMB</div>`;
      const dur = v.duration ? fmtDuration(v.duration) : '—';
      return `
        <div class="video-card">
          ${thumb}
          <div class="video-info">
            <div class="video-title">${escHtml(v.title)}</div>
            <div class="video-meta">
              <span>${dur}</span>
              <span>${v.size_mb} MB</span>
              <span>${v.age_days}d old</span>
              <span class="${expiryClass}">${expiryText}</span>
              ${v.has_comments ? '<span title="Comments saved">💬 comments</span>' : ''}
            </div>
          </div>
          <button class="btn btn-danger" data-filename="${escHtml(v.filename)}" onclick="deleteVideo(this.dataset.filename)">Delete</button>
        </div>`;
    }).join('');
  }

  async function deleteVideo(filename) {
    if (!confirm(`Delete "${filename}"?`)) return;
    await fetch(`/api/delete/${encodeURIComponent(filename)}`, { method: 'DELETE', headers: JSON_HEADERS });
    loadVideos();
  }

  async function manualCleanup() {
    const r = await fetch('/api/cleanup', { method: 'POST', headers: JSON_HEADERS });
    const d = await r.json();
    alert(`Cleanup complete. Deleted ${d.deleted.length} file(s).`);
    loadVideos();
  }

  async function rescan() {
    const r = await fetch('/api/rescan', { method: 'POST', headers: JSON_HEADERS });
    const d = await r.json();
    alert(`Rescan complete. Added ${d.added.length}, removed ${d.removed.length} stale entries.`);
    loadVideos();
  }

  async function cleanupFragments() {
    if (!confirm('This deletes leftover .f1xx/.f2xx/.f3xx audio/video fragment files from old downloads. Continue?')) return;
    const r = await fetch('/api/cleanup-fragments', { method: 'POST', headers: JSON_HEADERS });
    const d = await r.json();
    alert(`Removed ${d.removed.length} fragment file(s).`);
    loadVideos();
  }

  // --- Queue -------------------------------------------------------------
  // Downloads run server-side; the page only adds links and polls status, so
  // you can keep pasting links (or close the tab) while earlier ones run.

  const ICONS = { queued: '○', downloading: '↓', done: '✓', error: '✗', cancelled: '–' };
  let queueTimer = null;
  let lastDoneCount = null;

  async function addToQueue() {
    const input = document.getElementById('url-input');
    const url = input.value.trim();
    if (!url) return;
    input.value = '';
    input.focus();
    try {
      const r = await fetch('/api/queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed to queue');
      flashStatus('done', d.length > 1 ? `Queued ${d.length} links` : 'Queued');
    } catch (e) {
      input.value = url;
      flashStatus('error', `✗ ${e.message}`);
    }
    loadQueue();
  }

  async function loadQueue() {
    clearTimeout(queueTimer);
    let jobs = [];
    try {
      const r = await fetch('/api/queue');
      jobs = await r.json();
    } catch {}
    renderQueue(jobs);

    // Refresh the video list whenever another download completes
    const doneCount = jobs.filter(j => j.status === 'done').length;
    if (lastDoneCount !== null && doneCount > lastDoneCount) loadVideos();
    lastDoneCount = doneCount;

    const active = jobs.some(j => j.status === 'queued' || j.status === 'downloading');
    queueTimer = setTimeout(loadQueue, active ? 1500 : 5000);
  }

  function renderQueue(jobs) {
    const section = document.getElementById('queue-section');
    section.hidden = jobs.length === 0;
    if (!jobs.length) return;

    // Active jobs first (in queue order), then finished ones newest-first
    const active = jobs.filter(j => j.status === 'downloading' || j.status === 'queued');
    const finished = jobs.filter(j => !active.includes(j)).reverse();
    const pending = active.length;
    document.getElementById('queue-label').textContent =
      pending ? `Queue (${pending} remaining)` : 'Queue';
    document.getElementById('clear-btn').hidden = finished.length === 0;

    document.getElementById('queue-list').innerHTML = [...active, ...finished].map(j => {
      const title = j.title || j.url;
      const actions = [];
      if (j.status === 'error' || j.status === 'cancelled')
        actions.push(`<button class="btn" onclick="retryJob('${j.id}')">Retry</button>`);
      if (j.status === 'downloading')
        actions.push(`<button class="btn btn-danger" onclick="removeJob('${j.id}', true)">Cancel</button>`);
      else
        actions.push(`<button class="btn btn-danger" onclick="removeJob('${j.id}')">${j.status === 'queued' ? 'Remove' : '✕'}</button>`);
      const bar = j.status === 'downloading' ? `<div class="job-bar" style="width:${j.progress}%"></div>` : '';
      const icon = j.status === 'downloading' ? '<div class="spinner"></div>' : ICONS[j.status] || '';
      return `
        <div class="job ${j.status}">
          <div class="job-icon">${icon}</div>
          <div class="job-info">
            <div class="job-title" title="${escHtml(j.url)}">${escHtml(title)}</div>
            <div class="job-msg">${escHtml(j.msg || '')}</div>
          </div>
          <div class="job-actions">${actions.join('')}</div>
          ${bar}
        </div>`;
    }).join('');
  }

  async function removeJob(id, cancelling) {
    if (cancelling && !confirm('Cancel this download?')) return;
    await fetch(`/api/queue/${id}`, { method: 'DELETE', headers: JSON_HEADERS });
    loadQueue();
  }

  async function retryJob(id) {
    await fetch(`/api/queue/${id}/retry`, { method: 'POST', headers: JSON_HEADERS });
    loadQueue();
  }

  async function clearFinished() {
    await fetch('/api/queue/clear', { method: 'POST', headers: JSON_HEADERS });
    loadQueue();
  }

  let statusTimer = null;
  function flashStatus(type, msg) {
    setStatus(type, msg);
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => setStatus('', ''), 2500);
  }

  document.getElementById('url-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addToQueue();
  });

  function setStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = type;
    el.innerHTML = msg ? `<span>${escHtml(msg)}</span>` : '';
  }

  function fmtDuration(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  loadConfig();
  loadVideos();
  loadQueue();
  setInterval(loadVideos, 30000);
</script>
</body>
</html>
